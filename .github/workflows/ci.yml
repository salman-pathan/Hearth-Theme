name: Hearth CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify themes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Verify
        run: npm run verify

      - name: Check generated files are committed
        run: |
          git diff --exit-code -- \
            generated/ \
            extensions/vscode/themes/ \
            extensions/zed/themes/ \
            extensions/neovim/lua/hearth/theme.lua

      - name: Package VS Code extension
        run: |
          cd extensions/vscode
          npx --no-install vsce package \
            --no-dependencies \
            --out ../../hearth-theme.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: hearth-theme-vsix
          path: hearth-theme.vsix
